 "opts": ["صح", "خطأ"], "key": 0, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 1, "p": 21, "q": "ما أنواع المخاطر الرئيسية على سلامة الغذاء؟", "opts": ["ميكروبية وكيميائية فقط", "ميكروبية وكيميائية وفيزيائية والحساسية", "كيميائية وفيزيائية فقط", "ميكروبية وفيزيائية فقط"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 1, "p": 21, "q": "ما المثال على التلوث غير المباشر (العرضي) للغذاء؟", "opts": ["سقوط حشرة على الغذاء", "استخدام سكين غير نظيف لتقطيع غذاء مطبوخ", "لمس الغذاء بأيدٍ متسخة", "حفظ الغذاء في درجة حرارة غير مناسبة"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 1, "p": 21, "q": "أي ترتيب يطابق المخاطر التالية بأمثلتها: ميكروبي، كيميائي، فيزيائي، تحسسي؟", "opts": ["زجاج، مبيدات، سالمونيلا، فول سوداني غير معلن", "سالمونيلا، مبيدات، زجاج، فول سوداني غير معلن", "سالمونيلا، زجاج، مبيدات، فول سوداني غير معلن"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 1, "p": 14, "q": "كم مرضًا يمكن أن ينتقل عن طريق الغذاء بحسب الكتاب؟", "opts": ["أقل من ١٠ أمراض", "٢٠ مرضًا فقط", "أكثر من ٢٠٠ مرض"], "key": 2, "why": "أكثر من ٢٠٠ مرض.", "pic": null, "source": "تدريب"}, {"c": 1, "p": 15, "q": "توزيع الغذاء على عدة أماكن قد يوسّع أثر التلوث خارج موقع إنتاجه.", "opts": ["صح", "خطأ"], "key": 0, "why": "قد يُنقل الغذاء ويُوزع على أماكن كثيرة، فيتأثر مستهلكون بعيدون عن مصدر التلوث.", "pic": null, "source": "تدريب"}, {"c": 1, "p": 16, "q": "تقتصر مسؤولية سلامة الغذاء على الجهة الرقابية حتى بعد وصوله للمستهلك.", "opts": ["صح", "خطأ"], "key": 1, "why": "تضع الجهات المختصة الضوابط وتراقبها، وتطبق المنشآت والعاملون إجراءات السلامة، ويتداول المستهلك الغذاء بطريقة آمنة.", "pic": null, "source": "تدريب"}, {"c": 1, "p": 17, "q": "ما أثر نظام السلامة على المنشأة والعملاء؟", "opts": ["يزيد مدة صلاحية كل منتج تلقائيًا", "يغني عن فحص المواد الأولية", "يحمي المستهلك ويقلل الهدر"], "key": 2, "why": "يحمي المستهلك، ويقلل الهدر والخسائر، ويدعم الثقة بالمنشأة.", "pic": null, "source": "تدريب"}, {"c": 1, "p": 18, "q": "وجود مصدر خطر يعني احتمال حدوث ضرر، وقد يحدث التلوث عندما يصل الملوّث إلى الغذاء.", "opts": ["صح", "خطأ"], "key": 0, "why": "مصدر الخطر عامل قد يسبب الضرر، والتلوث يحدث عند وصول الملوّث إلى الغذاء.", "pic": null, "source": "تدريب"}, {"c": 1, "p": 19, "q": "صنّف الزجاج والمنظف ومسبّب الحساسية والبكتيريا.", "opts": ["فيزيائي، ميكروبي، كيميائي، تحسسي", "فيزيائي، كيميائي، تحسسي، ميكروبي", "كيميائي، فيزيائي، ميكروبي، تحسسي"], "key": 1, "why": "الزجاج فيزيائي، والمنظف كيميائي، ومسبّب الحساسية خطر تحسسي، والبكتيريا خطر ميكروبي.", "pic": null, "source": "تدريب"}, {"c": 1, "p": 20, "q": "قارن بين تقاطر عصارة اللحم على السلطة وتقطيع السلطة بسكين استُخدمت للحم النيئ.", "opts": ["الأول مباشر والثاني غير مباشر", "كلاهما مباشر", "الأول غير مباشر والثاني مباشر"], "key": 0, "why": "التقاطر تلوث مباشر، والانتقال عبر السكين تلوث غير مباشر أو عرضي.", "pic": null, "source": "تدريب"}, {"c": 2, "p": 32, "q": "جميع أنواع البكتيريا ضارة بالإنسان.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 2, "p": 32, "q": "يمكن للبكتيريا أن تنمو وتتكاثر في الغذاء المجمد.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 2, "p": 32, "q": "الطهي الجيد للغذاء يقتل معظم البكتيريا الضارة.", "opts": ["صح", "خطأ"], "key": 0, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 2, "p": 32, "q": "ما «المنطقة الخطرة» لنمو البكتيريا في الغذاء؟", "opts": ["بين ٠ و١٠ درجات مئوية", "بين ٥ و٦٣ درجة مئوية", "بين ٧٠ و١٠٠ درجة مئوية"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 2, "p": 32, "q": "ما أفضل طريقة للتحكم في نمو البكتيريا في الغذاء؟", "opts": ["إضافة الملح للغذاء", "التحكم في درجة الحرارة والوقت", "تغليف الغذاء بإحكام فقط"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 2, "p": 32, "q": "أيّ من الأغذية التالية يُعتبر من الأغذية عالية الخطورة؟", "opts": ["أ", "ب", "ج", "د"], "key": 2, "why": "", "pic": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKoAAACqCAIAAACyFEPVAACpM0lEQVR4nOz9169l2ZkfCC67vTn+XB8RmRnp  24, "q": "كل بكتيريا موجودة في الغذاء تسبب المرض.", "opts": ["صح", "خطأ"], "key": 1, "why": "لا. منها النافع ومنها المسبب للفساد ومنها الممرض.", "pic": null, "source": "تدريب"}, {"c": 2, "p": 25, "q": "ما العوامل الأربعة المؤثرة في تكاثر البكتيريا؟", "opts": ["الغذاء والرطوبة وشكل الوعاء ولونه", "الوقت والحرارة وحجم العبوة ووزنها", "الغذاء والرطوبة والوقت والحرارة"], "key": 2, "why": "الغذاء والرطوبة والوقت ودرجة الحرارة.", "pic": null, "source": "تدريب"}, {"c": 2, "p": 25, "q": "إضافة الماء إلى الحليب المجفف توفر رطوبة قد تسمح بنمو البكتيريا.", "opts": ["صح", "خطأ"], "key": 0, "why": "توفّر إضافة الماء الرطوبة اللازمة لنمو البكتيريا إذا توفرت بقية الظروف.", "pic": null, "source": "تدريب"}, {"c": 2, "p": 26, "q": "ما النطاق الحراري الخطر في الكتاب؟", "opts": ["صفر إلى ٤°م", "٦٣ إلى ٨٢°م", "٥ إلى ٦٣°م"], "key": 2, "why": "بين ٥ و٦٣°م. قلّل مدة بقاء الغذاء في هذا النطاق.", "pic": null, "source": "تدريب"}, {"c": 2, "p": 26, "q": "التجميد يقتل جميع البكتيريا الموجودة في الغذاء.", "opts": ["صح", "خطأ"], "key": 1, "why": "قد تبقى البكتيريا ساكنة وتستأنف نشاطها بعد الذوبان، لذلك لا يُعتمد على التجميد لقتلها.", "pic": null, "source": "تدريب"}, {"c": 2, "p": 27, "q": "لماذا لا يكفي الاعتماد على الطهي وحده لحماية الغذاء؟", "opts": ["لأن الغذاء المطبوخ يصبح معقمًا دائمًا", "قد تبقى بعض الأبواغ أو السموم", "الطهي لا يؤثر أبدًا في البكتيريا"], "key": 1, "why": "قد تبقى بعض الأبواغ أو السموم، لذلك يلزم أيضًا منع التلوث وضبط الحفظ والتبريد.", "pic": null, "source": "تدريب"}, {"c": 2, "p": 28, "q": "ما ثلاث وسائل للسيطرة على الخطر البكتيري؟", "opts": ["الاعتماد على الرائحة والمظهر والطعم", "تغيير لون العبوة وتاريخها ووزنها", "منع التلوث وضبط الوقت والحرارة والطهي الجيد"], "key": 2, "why": "منع وصول البكتيريا بالغسل والفصل، والحد من نموها بضبط الوقت والحرارة، والطهي الجيد.", "pic": null, "source": "تدريب"}, {"c": 2, "p": 29, "q": "قد يُستهلك الغذاء الجاهز للأكل دون طهي آخر يزيل التلوث اللاحق للتحضير.", "opts": ["صح", "خطأ"], "key": 0, "why": "قد تدعم نمو البكتيريا، وقد تؤكل دون خطوة طهي أخرى تزيل التلوث الذي حدث بعد التحضير.", "pic": null, "source": "تدريب"}, {"c": 2, "p": 30, "q": "بماذا تختلف الفيروسات عن البكتيريا في الغذاء؟", "opts": ["تتكاثر الفيروسات داخل أي غذاء رطب", "تتكاثر الفيروسات على أسطح الأواني النظيفة", "تحتاج الفيروسات إلى خلايا حية للتكاثر"], "key": 2, "why": "يمكن أن ينقل الغذاء الفيروسات، لكنها تحتاج إلى خلايا حية لتتكاثر.", "pic": null, "source": "تدريب"}, {"c": 2, "p": 31, "q": "أين تضع اللحم النيئ بالنسبة للغذاء الجاهز للأكل في الثلاجة؟", "opts": ["أسفله في وعاء يمنع تسرب العصارة", "بجانبه على لوح مشترك", "فوقه في وعاء مفتوح"], "key": 0, "why": "أسفل الغذاء الجاهز للأكل، داخل وعاء يمنع تسرب العصارة.", "pic": null, "source": "تدريب"}, {"c": 3, "p": 39, "q": "الملوثات الفيزيائية دائمًا مرئية بالعين المجردة.", "opts": ["صح", "خطأ"], "key": 0, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 3, "p": 39, "q": "يجب تغطية الغذاء المكشوف قبل رش المبيدات الحشرية.", "opts": ["صح", "خطأ"], "key": 0, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 3, "p": 39, "q": "التلوث الكيميائي للغذاء يحدث فقط عن طريق الخطأ.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 3, "p": 39, "q": "ما الإجراء الصحيح عند ملاحظة تلف في المعدات؟", "opts": ["محاولة إصلاحها بنفسك", "إبلاغ المشرف فورًا", "الاستمرار في استخدامها حتى نهاية اليوم"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 3, "p": 39, "q": "أيّ مما يلي من الملوثات الفيزيائية للغذاء؟", "opts": ["البكتيريا", "مواد التنظيف", "قطع الزجاج الصغيرة"], "key": 2, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 3, "p": 39, "q": "كيف يجب التعامل مع المواد الكيميائية في منشأة الغذاء؟", "opts": ["تخزينها مع المواد الغذائية لسهولة الوصول إليها", "نقلها من عبواتها الأصلية إلى عبوات أصغر", "تخزينها في أماكن مخصصة بعيدًا عن الغذاء"], "key": 2, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 3, "p": 34, "q": "اذكر ثلاثة مصادر للتلوث الكيميائي.", "opts": ["البكتيريا والعفن والطفيليات", "الشعر والزجاج والمعدن", "بقايا المنظفات والمبيدات والمواد الكيميائية من المعدات"], "key": 2, "why": "بقايا مواد التنظيف والمبيدات والمواد الكيميائية المتسربة من المعدات.", "pic": null, "source": "تدريب"}, {"c": 3, "p": 35, "q": "تُحفظ مواد التنظيف في مكان مخصص بعيدًا عن البهارات والمواد الغذائية.", "opts": ["صح", "خطأ"], "key": 0, "why": "أبعدها عن الغذاء وخزّنها في مكان مخصص بعبوتها المعرّفة، وأبلغ عن أي احتمال لتلوث الغذاء.", "pic": null, "source": "تدريب"}, {"c": 3, "p": 36, "q": "ما أمثلة الملوثات الفيزيائية وكيف يمكن أن تضر؟", "opts": ["منظف قد يترك بقايا كيميائية", "حليب قد يسبب حساسية", "شظايا زجاج قد تسبب جروحًا"], "key": 2, "why": "مثل الزجاج والمعدن والأجسام الغريبة، وقد تسبب جروحًا أو اختناقًا.", "pic": null, "source": "تدريب"}, {"c": 3, "p": 37, "q": "فحص المعدات والإبلاغ عن الأجزاء التالفة يقللان خطر التلوث الفيزيائي.", "opts": ["صح", "خطأ"], "key": 0, "why": "افحص المعدات، وأبلغ عن أي تلف، وأبعد الغذاء المعرض للتلوث.", "pic": null, "source": "تدريب"}, {"c": 3, "p": 38, "q": "لماذا يمكن أن تسبب قطعة القماش نوعين من التلوث؟", "opts": ["لا تلوث إلا إذا تغيّر لونها", "أليافها قد تسقط وميكروباتها قد تنتقل", "كل أليافها تتحول إلى مواد كيميائية"], "key": 1, "why": "قد تسقط أليافها في الغذاء فتلوثه فيزيائيًا، وقد تنقل الميكروبات من سطح لآخر.", "pic": null, "source": "تدريب"}, {"c": 4, "p": 44, "q": "جميع أنواع الأغذية تفسد بنفس السرعة.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 4, "p": 44, "q": "الغذاء الفاسد دائمًا ما تكون له رائحة كريهة.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 4, "p": 44, "q": "انتفاخ العلب المعدنية قد يكون علامة على فساد الغذاء.", "opts": ["صح", "خطأ"], "key": 0, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 4, "p": 44, "q": "ما الإجراء الصحيح عند ملاحظة علامات فساد على الغذاء عند استلامه؟", "opts": ["قبول الغذاء وتخزينه بعيدًا عن الأغذية الأخرى", "رفض استلام الغذاء", "قبول الغذاء واستخدامه بسرعة"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 4, "p": 44, "q": " "c": 5, "p": 53, "q": "أيّ من الأغذية التالية من أكثر الأغذية المسببة للحساسية؟", "opts": ["التفاح", "البطاطس", "الفول السوداني"], "key": 2, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 5, "p": 53, "q": "ما درجة الحرارة المناسبة لحفظ الغذاء الساخن لمنع نمو البكتيريا؟", "opts": ["٣٧°م أو أعلى", "٥٠°م أو أعلى", "٦٣°م أو أعلى"], "key": 2, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 5, "p": 53, "q": "ماذا تفعل إذا لاحظت انتفاخًا في علبة معدنية للغذاء؟", "opts": ["فتحها للتأكد من سلامة محتواها", "عدم استخدامها وإبلاغ المشرف فورًا", "وضعها في الثلاجة لتقليل الانتفاخ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 5, "p": 46, "q": "مَن الفئات الأكثر عرضة لمضاعفات الغذاء غير الآمن؟", "opts": ["الأطفال الصغار وكبار السن والحوامل وضعيفو المناعة", "العاملون في تحضير الغذاء وحدهم", "البالغون الأصحاء وحدهم"], "key": 0, "why": "الأطفال الصغار وكبار السن والحوامل وضعيفو المناعة.", "pic": null, "source": "تدريب"}, {"c": 5, "p": 47, "q": "ما الأعراض الشائعة للتسمم الغذائي؟", "opts": ["الغثيان والقيء والإسهال وآلام البطن", "قصر النظر وضعف السمع", "تكسّر الأسنان وحده"], "key": 0, "why": "منها الغثيان والقيء والإسهال وآلام البطن.", "pic": null, "source": "تدريب"}, {"c": 5, "p": 48, "q": "أي مصدر للتلوث يفسر ضرورة تغطية الجروح والامتناع عن لمس الغذاء بيد مصابة؟", "opts": ["شظايا المعدن التي قد تنفصل عن المعدات", "بقايا المنظف التي قد تبقى على الأواني", "المكورات العنقودية التي قد توجد على الجلد والجروح"], "key": 2, "why": "قد توجد المكورات العنقودية الذهبية على الجلد وفي الأنف والجروح.", "pic": null, "source": "تدريب"}, {"c": 5, "p": 48, "q": "فصل أدوات الدواجن النيئة عن أدوات الأغذية الجاهزة يساعد على منع انتقال السالمونيلا.", "opts": ["صح", "خطأ"], "key": 0, "why": "فصل الدواجن النيئة وأدواتها عن الغذاء الجاهز، وغسل اليدين والطهي الجيد.", "pic": null, "source": "تدريب"}, {"c": 5, "p": 49, "q": "لماذا لا يُترك الأرز المطبوخ طويلًا على طاولة التحضير؟", "opts": ["لأن سوء حفظه يرتبط بخطر بكتيريا باسيلس سيريوس", "لأن بقاءه على الطاولة يجعله أكثر حموضة بالضرورة", "لأن الخطر يقتصر على الأرز قبل الطهي"], "key": 0, "why": "لارتباطه بخطر بكتيريا باسيلس سيريوس عند سوء حفظه، لذلك ينبغي تبريده بسرعة وفق إجراء المنشأة.", "pic": null, "source": "تدريب"}, {"c": 5, "p": 49, "q": "ما عيوب العلب التي تستدعي استبعادها؟", "opts": ["اختلاف لون الملصق بين دفعتين", "اختلاف حجم العبوة عن حجم آخر لنفس المنتج", "الانتفاخ أو التسرب أو الثقوب"], "key": 2, "why": "الانتفاخ أو التسرب أو الثقوب أو تلف جسم العلبة أو لحامها.", "pic": null, "source": "تدريب"}, {"c": 5, "p": 50, "q": "قد ينقل الماء الملوث عوامل ممرضة إلى الإنسان.", "opts": ["صح", "خطأ"], "key": 0, "why": "بتناول غذاء أو ماء ملوث بعوامل ممرضة.", "pic": null, "source": "تدريب"}, {"c": 5, "p": 51, "q": "لا تظهر الحساسية الغذائية إلا بعد تناول كمية كبيرة من المكوّن.", "opts": ["صح", "خطأ"], "key": 1, "why": "قد تكفي كمية صغيرة لدى الشخص المتحسس، ويجب معرفة المكونات ومنع انتقال مسببات الحساسية.", "pic": null, "source": "تدريب"}, {"c": 5, "p": 52, "q": "ما مثال الضرر الذي يسببه الغذاء دون عدوى أو تسمم؟", "opts": ["عدوى من غذاء ملوث", "جرح بقطعة زجاج في الغذاء", "تسمم بسم بكتيري"], "key": 1, "why": "جرح بسبب قطعة زجاج أو اختناق بجسم غريب.", "pic": null, "source": "تدريب"}, {"c": 6, "p": 61, "q": "يمكن ارتداء الحلي والساعات أثناء العمل في مجال الغذاء.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 6, "p": 61, "q": "يجب غسل اليدين قبل ارتداء القفازات وبعد تغييرها.", "opts": ["صح", "خطأ"], "key": 0, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 6, "p": 61, "q": "يمكن استخدام حوض غسل اليدين لغسل الأدوات والغذاء.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 6, "p": 61, "q": "ما المدة المناسبة لغسل اليدين؟ (حسب شرح الكتاب)", "opts": ["٥ ثوانٍ", "١٠ ثوانٍ", "٢٠ ثانية على الأقل"], "key": 2, "why": "تنبيه: يذكر شرح ص ٥٨ أن غسل اليدين يستغرق ٢٠ ثانية على الأقل، أي الخيار ج. مفتاح ص ١٢٥ يذكر ب.", "pic": null, "source": "من الكتاب"}, {"c": 6, "p": 61, "q": "ماذا تفعل إذا شعرت بالحاجة للعطس أثناء التعامل مع الغذاء؟", "opts": ["العطس مباشرة على الغذاء", "الابتعاد عن الغذاء وتغطية الفم بالذراع", "العطس في يديك ثم مواصلة العمل"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 6, "p": 61, "q": "ما اللون المفضل للضمادات المستخدمة لتغطية الجروح في مناطق تحضير الغذاء؟", "opts": ["الشفاف", "الأبيض", "الأزرق"], "key": 2, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 6, "p": 55, "q": "قد تحمل اليدان جراثيم حتى لو بدتا نظيفتين.", "opts": ["صح", "خطأ"], "key": 0, "why": "يمكن أن يحمل الجسم واليدان جراثيم لا تُرى وتنتقل إلى الغذاء.", "pic": null, "source": "تدريب"}, {"c": 6, "p": 56, "q": "متى تبدأ النظافة الشخصية المرتبطة بالعمل؟", "opts": ["في نهاية الوردية فقط", "بعد لمس الغذاء للمرة الأولى", "قبل الوصول إلى المنشأة"], "key": 2, "why": "قبل الوصول إلى المنشأة، بالعناية بالجسم ونظافة الملابس والأظافر والشعر.", "pic": null, "source": "تدريب"}, {"c": 6, "p": 57, "q": "ما مواصفات ملابس العامل المناسبة؟", "opts": ["ملابس نظيفة وغطاء للشعر وحذاء مناسب", "زي نظيف مع ترك الشعر مكشوفًا", "ملابس خارجية وقفازات فقط"], "key": 0, "why": "ملابس عمل نظيفة، وغطاء مناسب للشعر، وأحذية ملائمة للعمل.", "pic": null, "source": "تدريب"}, {"c": 6, "p": 58, "q": "ما مدة غسل اليدين في شرح المهارة؟", "opts": ["٥ ثوانٍ", "٢٠ ثانية على الأقل", "١٠ ثوانٍ"], "key": 1, "why": "٢٠ ثانية على الأقل بالماء الدافئ والصابون في حوض مخصص. مفتاح سؤال الفصل السابع يذكر «ب» أي ١٠ ثوانٍ، وهو تعارض مع الشرح.", "pic": null, "source": "تدريب"}, {"c": 6, "p": 58, "q": "يلزم غسل اليدين بعد الاستراحة وقبل ارتداء قفازات جديدة.", "opts": ["صح", "خطأ"], "key": 0, "why": "بعد دورة المياه والاستراحة ولمس الجسم، وقبل وبعد الغذاء النيئ، وقبل ارتداء القفازات وبين تغييرها.", "pic": null, "source": "تدريب"}, {"c": 6, "p": 59, "q": "كيف تتصرف إذا احتجت إلى العطس أثناء التحضير؟", "opts": ["أدير وجهي فوق سطح تحضير آخر", "أعطس في قفازي وأواصل العمل", "أبتعد عن الغذاء وأغطي فمي وأنفي بذراعي"], "key": 2, "why": "ابتعد عن الغذاء وغطّ الفم والأنف بالذراع، واغسل يديك قبل متابعة التداول.", "pic": null, "source": "تدريب"}, {"c": 6, "p": 60, "q": "نفخ الأكياس بالفم قد ينقل اللعاب والجراثيم إليها.", "opts": ["صح", "خطأ"], "key": 0, "why": "قد ينقل اللعاب والجراثيم إلى العبوة أو الغذاء.", "pic": null, "source": "تدريب"}, {"c": 7, "p": 73, "q": "التنظيف والتطهير هما نفس الشيء.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 7, "p": 73, "q": "النفايات لا تشكل خطرًا على سلامة الغذاء.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 7, "p": 73, "q": "وجود روائح غريبة في المنشأة قد يكون علامة على وجود آفات.", "opts": ["صح", "خطأ"], "key": 0, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 7, "p": 73, "q": "ما درجة حرارة الماء المناسبة للتنظيف الرئيسي؟", "opts": ["٢٥°م", "٥٠°م", "٦٣°م"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 7, "p": 73, "q": "أيّ مما يلي ليس من خصائص حاويات النفايات المثالية؟", "opts": ["تفتح باليد", "مقاومة للآفات", "مزودة بغطاء محكم"], "key": 0, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 7, "p": 73, "q": "ماذا تفعل إذا لاحظت علامات وجود آفات في منشأة الغذاء؟", "opts": ["تجاهل الأمر إذا كانت الآفات قليلة", "إبلاغ المشرف فورًا", "محاولة مكافحة الآفات بنفسك"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 7, "p": 63, "q": "كيف تميّز بين سطح نظيف وسطح مطهّر؟", "opts": ["كل سطح يبدو نظيفًا يكون مطهّرًا", "التنظيف يزيل الأوساخ والتطهير يخفض الميكروبات", "التطهير يزيل الأوساخ المرئية فقط"], "key": 1, "why": "التنظيف يزيل البقايا والأوساخ المرئية، والتطهير بعده يخفض الميكروبات إلى مستوى آمن.", "pic": null, "source": "تدريب"}, {"c": 7, "p": 64, "q": "أيّهما يحتاج إلى تنظيف وتطهير بعد كل استخدام، لوح التقطيع أم الجدار؟", "opts": ["الجدار لأنه أكبر مساحة", "كلاهما يحتاج فقط إلى تنظيف أسبوعي", "لوح التقطيع لأنه يلامس الغذاء"], "key": 2, "why": "لوح التقطيع لأنه يلامس الغذاء، أما الجدار فيُنظّف دوريًا حسب الجدول والحاجة.", "pic": null, "source": "تدريب"}, {"c": 7, "p": 64, "q": "لماذا تُطهّر مقابض الأبواب والصنابير؟", "opts": ["لأنها تلامس الغذاء عند الطهي دائمًا", "لأن الأيدي قد تنقل الميكروبات منها إلى الغذاء", "لأن تطهيرها يغني عن غسل اليدين"], "key": 1, "why": "لأن الأيدي تلمسها باستمرار ويمكن أن تنقل منها الجراثيم إلى الغذاء.", "pic": null, "source": "تدريب"}, {"c": 7, "p": 65, "q": "رتب المراحل الست لتنظيف الأسطح وتطهيرها.", "opts": ["شطف، تجفيف، تطهير، تنظيف أولي، تنظيف رئيسي، تجفيف", "تنظيف أولي، تطهير، تجفيف، تنظيف رئيسي، شطف، تجفيف", "تنظيف أولي، تنظيف رئيسي، شطف، تطهير، شطف عند الحاجة، تجفيف"], "key": 2, "why": "التنظيف الأولي، التنظيف الرئيسي، الشطف الأولي، التطهير، الشطف النهائي عند الحاجة، التجفيف.", "pic": null, "source": "تدريب"}, {"c": 7, "p": 65, "q": "كم تبلغ حرارة ماء التنظيف الرئيسي؟", "opts": ["حوالي ١٠°م", "حوالي ٥٠°م", "حوالي ٢٥°م"], "key": 1, "why": "حوالي ٥٠°م مع المنظف. وهذه مرحلة تختلف عن التطهير الحراري.", "pic": null, "source": "تدريب"}, {"c": 7, "p": 66, "q": "ما وظيفة كل حوض في طريقة الحوض الثلاثي؟", "opts": ["غسل، ثم تجفيف، ثم شطف", "تطهير، ثم غسل، ثم شطف", "غسل، ثم شطف، ثم تطهير"], "key": 2, "why": "الأول للغسل بالمنظف، والثاني للشطف، والثالث للتطهير، ثم تُجفّف الأدوات.", "pic": null, "source": "تدريب"}, {"c": 7, "p": 67, "q": "قد تلوّث الممسحة الأواني النظيفة إذا خُزّنت بجوارها.", "opts": ["صح", "خطأ"], "key": 0, "why": "يمكن أن تنقل الملوثات إلى الأواني بعد تنظيفها.", "pic": null, "source": "تدريب"}, {"c": 7, "p": 68, "q": "بماذا تتميز حاوية النفايات المناسبة؟", "opts": ["مغطاة بقطعة قماش فقط", "مفتوحة باستمرار للتهوية", "محكمة الغطاء وتُفتح دون لمسها باليد"], "key": 2, "why": "متينة وسهلة التنظيف، بغطاء محكم، وتُفتح دون لمسها باليد.", "pic": null, "source": "تدريب"}, {"c": 7, "p": 69, "q": "ما نتيجة تراكم النفايات في منطقة التداول؟", "opts": ["يساعد على اكتشاف كل الملوثات", "يقلل انتقال الروائح", "يجذب الآفات ويرفع خطر التلوث"], "key": 2, "why": "يزيد الروائح ويجذب الآفات ويرفع احتمال تلوث الأسطح والغذاء.", "pic": null, "source": "تدريب"}, {"c": 7, "p": 70, "q": "ماذا تبحث عنه الآفات في منشآت الغذاء؟", "opts": ["الرفوف المعدنية فقط", "الغذاء والماء والمأوى", "الإضاءة والمصابيح فقط"], "key": 1, "why": "الغذاء والماء والمأوى. تساعد النظافة وسد منافذ الدخول على منعها.", "pic": null, "source": "تدريب"}, {"c": 7, "p": 71, "q": "اذكر دلائل وجود آفات حتى لو لم ترَ الآفة نفسها.", "opts": ["اختلاف لون الأرضية بين غرفتين", "وجود ملصق على العبوة", "آثار القضم والفضلات"], "key": 2, "why": "فضلات أو آثار قضم أو عبوات تالفة أو روائح غير معتادة.", "pic": null, "source": "تدريب"}, {"c": 7, "p": 72, "q": "ترك الفتحات دون حماية والنفايات مكشوفة يسهل دخول الآفات وانتشارها.", "opts": ["صح", "خطأ"], "key": 0, "why": "ترك الأغذية والنفايات مكشوفة، وإهمال التنظيف، وترك الأبواب أو الفتحات دون حماية.", "pic": null, "source": "تدريب"}, {"c": 8, "p": 79, "q": "الاشتراطات العامة لمنشآت الغذاء تشمل فقط تصميم المباني ولا تهتم بجودة الأدوات والمعدات.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 8, "p": 79, "q": "يجب أن تكون الأرضيات والجدران والأسقف في منشآت الغذاء مقاومة للماء وسهلة التنظيف.", "opts": ["صح", "خطأ"], "key": 0, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 8, "p": 79, "q": "يمكن استخدام نفس الحوض لغسل الخضروات وغسل الأواني طالما يتم تنظيفه جيدًا بينهما.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 8, "p": 79, "q": "ما الهدف الرئيسي من الفصل بين المناطق النظيفة وغير النظيفة في منشآت الغذاء؟", "opts": ["توفير مساحة أكبر للعمل", "منع انتقال التلوث بين المناطق المختلفة", "تسهيل عملية التنظيف فقط"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 8, "p": 79, "q": "لماذا يجب أن تكون الأدوات والمعدات في منشآت الغذاء مصنوعة من مواد معينة؟", "opts": ["لتكون أرخص ثمنًا", "لتكون أثقل وزنًا وأكثر ثباتًا", "لتكون آمنة وسهلة التنظيف"], "key": 2, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 8, "p": 79, "q": "ما الإجراء الصحيح عند ملاحظة مصباح معطل في منطقة إعداد الغذاء؟", "opts": ["تجاهل الأمر طالما هناك إضاءة كافية من مصادر أخرى", "محاولة إصلاح المصباح بنفسك", "إبلاغ المشرف فورًا عن المصباح المعطل"], "key": 2, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 8, "p": 75, "q": "ما الهدف من اشتراطات تصميم المنشأة؟", "opts": ["تسهيل التنظيف ومنع انتقال التلوث", "جمع الأعمال النظيفة والمتسخة في منطقة واحدة", "زيادة مساحة العرض فقط"], "key": 0, "why": "تسهيل العمل والتنظيف الآمن ومنع انتقال التلوث بين مناطق العمل.", "pic": null, "source": "تدريب"}, {"c": 8, "p": 76, "q": "أي خصائص يحتاجها الجدار أو الأرضية في منطقة التحضير؟", "opts": ["مسامي يمتص الماء", "سليم ومقاوم للماء وسهل التنظيف", "خشن يحتجز البقايا"], "key": 1, "why": "سطح سليم ومقاوم للماء وسهل التنظيف.", "pic": null, "source": "تدريب"}, {"c": 8, "p": 77, "q": "على العامل إبلاغ المشرف عندما يكتشف خللًا في المرافق.", "opts": ["صح", "خطأ"], "key": 0, "why": "إبلاغ المشرف عنه والمحافظة على نظافة المكان واستخدام المرافق للغرض المخصص.", "pic": null, "source": "تدريب"}, {"c": 8, "p": 78, "q": "ما أثر الإضاءة والتهوية الجيدتين؟", "opts": ["الاستغناء عن التنظيف اليومي", "تسهيل رؤية التلف وتقليل الرطوبة", "الاستغناء عن متابعة التبريد"], "key": 1, "why": "تسهّل الإضاءة رؤية الأوساخ والتلف، وتساعد التهوية على تقليل الرطوبة والروائح.", "pic": null, "source": "تدريب"}, {"c": 9, "p": 84, "q": "إدارة سلامة الغذاء تهتم فقط بمرحلة التحضير والتقديم في المنشأة الغذائية.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 9, "p": 84, "q": "نظام الهاسب (HACCP) يركز على معالجة المشاكل بعد حدوثها في عملية إنتاج الغذاء.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 9, "p": 84, "q": "تطبيق المتطلبات الأساسية مثل تصميم المنشأة بشكل آمن ووجود مرافق كافية ضروري قبل تنفيذ نظام الهاسب.", "opts": ["صح", "خطأ"], "key": 0, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 9, "p": 84, "q": "ما الخطوة الأولى في عملية تطبيق نظام الهاسب؟", "opts": ["إجراء تحليل المخاطر", "تشكيل فريق الهاسب", "تحديد نقاط التحكم الحرجة"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 9, "p": 84, "q": "أيّ مما يلي ليس من المتطلبات الأساسية قبل تطبيق نظام الهاسب؟", "opts": ["وضع معايير واضحة لجودة المواد الأولية", "تطبيق خطة فعالة لمكافحة الآفات", "تحديد الإجراءات التصحيحية لنقاط التحكم الحرجة"], "key": 2, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 9, "p": 84, "q": "ما الهدف الرئيسي من إنشاء نظام للتوثيق وحفظ السجلات في نظام الهاسب؟ (حسب شرح الكتاب)", "opts": ["زيادة الأعباء الإدارية على العاملين", "إثبات تطبيق وصيانة نظام الهاسب", "تحسين العلاقات مع الموردين"], "key": 1, "why": "تنبيه: يشرح ص ٨٣ أن السجلات تثبت تطبيق النظام وصيانته، أي الخيار ب. المفتاح يذكر ج.", "pic": null, "source": "من الكتاب"}, {"c": 9, "p": 81, "q": "ما المقصود بنظام الهاسب HACCP؟", "opts": ["تحليل المخاطر ونقاط التحكم الحرجة", "تقييم رضا المستهلك بعد البيع", "تدوير المخزون حسب تاريخ الوصول"], "key": 0, "why": "تحليل المخاطر ونقاط التحكم الحرجة. يحدد الأخطار ويضع إجراءات وقائية للتحكم فيها.", "pic": null, "source": "تدريب"}, {"c": 9, "p": 82, "q": "ما أمثلة المتطلبات التي تسبق تطبيق الهاسب؟", "opts": ["تحديد سعر البيع وشكل الإعلان", "تصميم ملائم وبرامج نظافة ومكافحة آفات", "تصميم شعار المنشأة"], "key": 1, "why": "تصميم ملائم، ومرافق كافية، ومواصفات للمواد الأولية، وبرامج النظافة ومكافحة الآفات وتدريب العاملين.", "pic": null, "source": "تدريب"}, {"c": 9, "p": 83, "q": "كم خطوة لتطبيق الهاسب، وكم منها مبادئ أساسية؟", "opts": ["٧ خطوات منها ٥ مبادئ", "١٢ خطوة منها ٧ مبادئ", "١٠ خطوات منها ٣ مبادئ"], "key": 1, "why": "١٢ خطوة، والخطوات من السادسة إلى الثانية عشرة هي المبادئ السبعة.", "pic": null, "source": "تدريب"}, {"c": 9, "p": 83, "q": "رتب الخطوات الخمس التمهيدية للهاسب.", "opts": ["تشكيل الفريق، وصف المنتج، تحديد استخدامه، إعداد مخطط التدفق، التحقق منه ميدانيًا", "تشكيل الفريق، إعداد المخطط، التحقق منه، وصف المنتج، تحديد الاستخدام", "وصف المنتج، تشكيل الفريق، التحقق من المخطط، إعداد المخطط، تحديد الاستخدام"], "key": 0, "why": "تشكيل الفريق، وصف المنتج، تحديد الاستخدام المقصود، إعداد مخطط تدفق العمليات، والتحقق من المخطط في الموقع.", "pic": null, "source": "تدريب"}, {"c": 9, "p": 83, "q": "رتب المبادئ السبعة للهاسب.", "opts": ["تحليل المخاطر، التحقق، التصحيح، وضع الحدود، التوثيق، المراقبة، تحديد النقاط", "تحليل المخاطر، تحديد نقاط التحكم، وضع الحدود، المراقبة، التصحيح، التحقق، التوثيق", "المراقبة، التصحيح، تحليل المخاطر، وضع الحدود، التحقق، تحديد النقاط، التوثيق"], "key": 1, "why": "تحليل المخاطر، تحديد نقاط التحكم الحرجة، وضع الحدود الحرجة، المراقبة، الإجراءات التصحيحية، التحقق، والتوثيق وحفظ السجلات.", "pic": null, "source": "تدريب"}, {"c": 9, "p": 83, "q": "ما فائدة السجلات عند مراجعة نظام الهاسب؟", "opts": ["إثبات التطبيق والصيانة وتتبع الإجراءات", "استبدال مراقبة نقاط التحكم", "الاكتفاء بسجل الشكاوى"], "key": 0, "why": "إثبات تطبيق النظام وصيانته والرجوع إلى القراءات والإجراءات. هذا هو الخيار «ب» في ص ٨٤، بينما المفتاح يورد «ج».", "pic": null, "source": "تدريب"}, {"c": 10, "p": 91, "q": "يجب تخزين الغذاء المبرد في درجة حرارة ٥°م أو أقل.", "opts": ["صح", "خطأ"], "key": 0, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 10, "p": 91, "q": "يمكن إعادة تسخين الغذاء لدرجة حرارة ٦٠°م فقط.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 10, "p": 91, "q": "من الضروري فصل الأغذية النيئة عن الأغذية الجاهزة للأكل أثناء التحضير.", "opts": ["صح", "خطأ"], "key": 0, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 10, "p": 91, "q": "ما درجة الحرارة الداخلية المناسبة لطهي الغذاء بشكل آمن؟", "opts": ["٥٠°م", "٦٣°م", "٧٥°م"], "key": 2, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 10, "p": 91, "q": "كم من الوقت يجب أن يستغرق تبريد الغذاء الساخن؟", "opts": ["خلال ساعة واحدة", "خلال ساعة ونصف", "خلال ساعتين"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 10, "p": 91, "q": "عند عرض الغذاء الساخن، ما درجة الحرارة المناسبة؟", "opts": ["٥٥°م أو أعلى", "٦٠°م أو أعلى", "٦٣°م أو أعلى"], "key": 2, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 10, "p": 86, "q": "ما المراحل التي يغطيها التداول الآمن؟", "opts": ["من الشراء والنقل حتى العرض والتقديم", "من الطهي حتى نهاية التبريد فقط", "من وصول المستهلك حتى مغادرته"], "key": 0, "why": "الشراء والنقل، الاستلام والتخزين، التحضير والإعداد، ثم الحفظ والعرض والتقديم.", "pic": null, "source": "تدريب"}, {"c": 10, "p": 87, "q": "كيف تختار المورد ووسيلة نقل الغذاء؟", "opts": ["أقرب مورد ووسيلة مفتوحة دائمًا", "أرخص مورد دون فحص طريقة النقل", "مورد موثوق ووسيلة نظيفة تحافظ على الحرارة المطلوبة"], "key": 2, "why": "اشترِ من مورد موثوق واستخدم وسيلة نظيفة تحافظ على الحرارة المطلوبة وتمنع التلوث.", "pic": null, "source": "تدريب"}, {"c": 10, "p": 88, "q": "ما الأمور التي تفحصها قبل قبول شحنة؟", "opts": ["الحرارة وسلامة العبوة والصلاحية وحالة الغذاء", "السعر ولون الشاحنة فقط", "حجم الشحنة وعدد العاملين فقط"], "key": 0, "why": "درجة الحرارة، وسلامة العبوة، والصلاحية، وجودة الغذاء وعلامات التلف.", "pic": null, "source": "تدريب"}, {"c": 10, "p": 89, "q": "ما معيار الطهي الوارد في فصل التداول؟", "opts": ["٥٠°م داخليًا لمدة ٣٠ ثانية", "٧٥°م داخليًا لمدة ٣٠ ثانية على الأقل", "٦٣°م داخليًا لمدة ١٠ ثوانٍ"], "key": 1, "why": "حرارة داخلية تبلغ ٧٥°م لمدة ٣٠ ثانية على الأقل.", "pic": null, "source": "تدريب"}, {"c": 10, "p": 89, "q": "ما مدة تبريد الغذاء الساخن في سؤال فصل التداول؟", "opts": ["خلال ساعة ونصف", "خلال ثلاث ساعات", "خلال نصف ساعة"], "key": 0, "why": "خلال ساعة ونصف حسب ص ٨٩ ومفتاح الفصل. يرد في مثال الأرز بص ٤٩ التبريد خلال ساعتين إلى أقل من ٥°م.", "pic": null, "source": "تدريب"}, {"c": 10, "p": 89, "q": "ما درجة إعادة التسخين المذكورة في فصل التحضير؟", "opts": ["أعلى من ٥٠°م فقط", "أعلى من ٨٢°م", "٦٠°م بالضبط"], "key": 1, "why": "أعلى من ٨٢°م وفق صياغة هذه الصفحة.", "pic": null, "source": "تدريب"}, {"c": 10, "p": 90, "q": "قارن بين الحدّين الواردين للعرض الساخن والبارد.", "opts": ["الساخن ٣٧°م أو أعلى، والبارد ٢٠°م أو أقل", "الساخن ٦٣°م أو أعلى، والبارد ٨°م أو أقل", "الساخن ٥٠°م أو أعلى، والبارد ١٥°م أو أقل"], "key": 1, "why": "العرض الساخن ٦٣°م أو أعلى، والعرض البارد ٨°م أو أقل. يختلف حد العرض البارد عن حد تخزين المبرد البالغ ٥°م أو أقل.", "pic": null, "source": "تدريب"}, {"c": 10, "p": 90, "q": "ماذا تفعل إذا تعطلت وحدة العرض ولم تحافظ على الحرارة؟", "opts": ["أستمر بالعرض ما دام المظهر طبيعيًا", "أوقف تسجيل الحرارة حتى انتهاء العطل", "أبلغ المشرف والصيانة وأتبع إجراء إزالة الغذاء عند تجاوز الحدود"], "key": 2, "why": "أبلغ المشرف والصيانة، واستشر المشرف لإزالة الغذاء من العرض عند تجاوز الحدود الآمنة.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 106, "q": "عند تنظيف وتطهير الأسطح باستخدام طريقة الأربع مراحل، يجب دائمًا شطف السطح بعد استخدام المنظف المطهر (Sanitizer).", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 11, "p": 106, "q": "في طريقة الحوض الثلاثي لتنظيف وتطهير الأواني، يُستخدم الحوض الأول للتنظيف الرئيسي والحوض الثالث للتطهير.", "opts": ["صح", "خطأ"], "key": 0, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 11, "p": 106, "q": "عند تخزين الأغذية الجافة، يجب وضعها مباشرة على الأرض لضمان ثباتها.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 11, "p": 106, "q": "ما درجة الحرارة المناسبة لتخزين الأغذية المجمدة؟", "opts": ["صفر درجة مئوية", "−١٨ درجة مئوية أو أقل", "−١٠ درجات مئوية"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 11, "p": 106, "q": "عند تطبيق مبدأ «الوارد أولًا يُصرف أولًا» (FIFO) في تخزين الأغذية، ماذا يجب أن تفعل؟", "opts": ["وضع المنتجات الجديدة في المقدمة للاستخدام أولًا", "تخزين المنتجات الجديدة خلف أو تحت المنتجات الأقدم", "عدم الاهتمام بترتيب المنتجات حسب تاريخ الصلاحية"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 11, "p": 106, "q": "عند استخدام طريقة الحوض الثنائي لتنظيف وتطهير الأواني، ما درجة حرارة الماء المناسبة للتطهير الحراري؟", "opts": ["٥٠°م لمدة دقيقة واحدة", "٦٠°م لمدة ٣٠ ثانية", "٧٥°م لمدة ٣٠ ثانية أو ٨٢°م لمدة ١٠ ثوانٍ"], "key": 2, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 11, "p": 93, "q": "ما المواضع التي يسهل نسيانها عند غسل اليدين؟", "opts": ["أطراف الأصابع فقط", "بين الأصابع وتحت الأظافر وحول المعصمين", "باطن الكف وحده"], "key": 1, "why": "بين الأصابع، وتحت الأظافر، وحول المعصمين. جفف اليدين بورق نظيف وتجنب لمس الصنبور مجددًا.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 94, "q": "عند تغيير المهمة تُغيّر القفازات وتُغسل اليدان قبل ارتداء زوج نظيف.", "opts": ["صح", "خطأ"], "key": 0, "why": "عند اتساخها أو تلفها أو تغيير المهمة. اخلعها دون تلويث يديك، واغسل يديك قبل ارتداء قفازات نظيفة.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 95, "q": "أين تضع مسبار الحرارة في اللحم ومتى تقرأه؟", "opts": ["ملاصقًا لقاع الوعاء وأقرأ فورًا", "على سطح اللحم بعد إخراج المسبار", "في أسمك جزء بعيدًا عن العظم، وأنتظر استقرار القراءة"], "key": 2, "why": "في أسمك جزء بعيدًا عن العظم والوعاء. انتظر ١٥–٢٠ ثانية أو حتى تستقر القراءة.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 95, "q": "كيف تقيس حرارة الحساء؟", "opts": ["أحرّكه وأقيس في الوسط دون لمس الوعاء", "أقيس حرارة حافة القدر فقط", "أضع المسبار على الغطاء"], "key": 0, "why": "حرّكه ثم ضع المسبار في الوسط بعمق ٥ سم على الأقل دون لمس الوعاء.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 95, "q": "يُنظّف مسبار الحرارة ويُطهّر قبل القياس وبعده.", "opts": ["صح", "خطأ"], "key": 0, "why": "تحقق من سلامته ومعايرته، ونظّف وطهّر طرفه قبل الاستخدام وبعده، وسجّل القراءة.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 96, "q": "يمكن قبول شحنة لمجرد أن مظهرها سليم حتى لو لم تكن حرارتها مناسبة.", "opts": ["صح", "خطأ"], "key": 1, "why": "لا يكفي المظهر لقبولها. قِس الحرارة وأبلغ المشرف واتبع إجراء الرفض أو العزل.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 97, "q": "وصلت شحنة جديدة، فأين تضعها وفق FIFO؟", "opts": ["في مكان الأقدم بعد إخفاء تاريخه", "خلف المخزون الأقدم أو تحته", "أمام المخزون الأقدم"], "key": 1, "why": "خلف المخزون الأقدم أو تحته، حتى يُصرف الوارد أولًا، مع مراعاة تواريخ الصلاحية.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 98, "q": "ما درجة حرارة المخزن الجاف وما أدنى ارتفاع للأرفف؟", "opts": ["أقل من ٢٥°م وارتفاع ١٥ سم على الأقل", "أقل من ٤٠°م وعلى الأرض مباشرة", "أقل من ٣٥°م وارتفاع ٥ سم"], "key": 0, "why": "أقل من ٢٥°م، والأرفف بارتفاع ١٥ سم على الأقل عن الأرض.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 98, "q": "ما البيانات التي تضعها على عبوة التخزين؟", "opts": ["اسم الموظف فقط", "سعر العبوة فقط", "المحتوى وتاريخ التخزين"], "key": 2, "why": "اسم المحتوى وتاريخ التخزين، مع حفظ الغذاء في حاوية مناسبة محكمة.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 99, "q": "ما درجة تخزين المجمدات المذكورة في الكتاب؟", "opts": ["صفر مئوي", "موجب ٥°م", "سالب ١٨°م أو أقل"], "key": 2, "why": "سالب ١٨°م أو أقل، مع متابعة درجة الحرارة وتسجيلها.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 100, "q": "كيف تحدد تركيز مطهر الخضروات وزمن النقع؟", "opts": ["بمضاعفة التركيز في كل استخدام", "بحسب تعليمات المنتج المخصص لهذا الاستخدام", "بحسب الرائحة بعد التخفيف"], "key": 1, "why": "حسب تعليمات المنتج المخصص لهذا الاستخدام. يسبق النقع غسل الخضروات بالماء الجاري، ويليه الشطف حسب إجراء الكتاب.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 101, "q": "كيف تُذيب الغذاء المجمد في الثلاجة؟", "opts": ["على طاولة العمل طوال الليل", "في ثلاجة بين صفر و٤°م مع منع تسرب العصارة", "داخل وعاء مكشوف فوق الأغذية الجاهزة"], "key": 1, "why": "راجع تعليمات العبوة، وضع الغذاء في وعاء مناسب يمنع تسرب العصارة، في ثلاجة بين صفر و٤°م حتى يذوب.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 102, "q": "ما أول إجراء لحماية الغذاء قبل تنظيف الأسطح؟", "opts": ["أرش المنظف حول الغذاء المكشوف", "أضع الغذاء أسفل السطح", "أعزل الغذاء عن منطقة التنظيف"], "key": 2, "why": "اعزله وأبعده عن منطقة التنظيف حتى لا تصله بقايا أو مواد كيميائية.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 103, "q": "ما الفرق بين طريقة الأربع مراحل وطريقة الست؟", "opts": ["طريقة الأربع تجمع التنظيف والتطهير بمنظف مطهر", "طريقة الأربع تلغي زمن التلامس", "طريقة الست تبدأ بالتجفيف"], "key": 0, "why": "تستخدم الأربع منظفًا مطهرًا يجمع التنظيف والتطهير، مع الالتزام بزمن التلامس ثم التجفيف. اتبع تعليمات المنتج بشأن الشطف.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 103, "q": "ما زمن تلامس المنظف المطهر المذكور مثالًا في الكتاب؟", "opts": ["٥ ثوانٍ ثابتة لكل المنتجات", "عادةً من ٣٠ ثانية إلى ٥ دقائق حسب المنتج", "٣٠ دقيقة ثابتة لكل المنتجات"], "key": 1, "why": "عادةً من ٣٠ ثانية إلى ٥ دقائق، والمدة المعتمدة هي المبيّنة على المنتج.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 104, "q": "كيف تُجفف الأواني بعد التطهير؟", "opts": ["مقلوبة على رف التجفيف", "متداخلة وهي مبللة في خزانة مغلقة", "بقطعة قماش استُخدمت لمسح الطاولة"], "key": 0, "why": "تُترك مقلوبة على رف التجفيف بالهواء، أو تستخدم مناديل ورقية مناسبة وفق إجراء الكتاب.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 105, "q": "كيف تختلف وظيفة الأحواض في طريقة الحوض الثنائي؟", "opts": ["الأول للغسل والشطف والثاني للتطهير", "الأول للتطهير والثاني للغسل", "الأول للغسل والثاني للتجفيف"], "key": 0, "why": "الغسل والشطف بالماء الجاري في الأول، والتطهير في الثاني.", "pic": null, "source": "تدريب"}, {"c": 11, "p": 105, "q": "ما بديلَا الحرارة والزمن للتطهير الحراري للأواني؟", "opts": ["٥٠°م لمدة ١٠ ثوانٍ أو ٦٠°م لمدة ثانية", "٧٥°م لمدة ٣٠ ثانية أو ٨٢°م لمدة ١٠ ثوانٍ", "٧٥°م لمدة ٣ ثوانٍ أو ٨٢°م لمدة ثانية"], "key": 1, "why": "٧٥°م لمدة ٣٠ ثانية، أو ٨٢°م لمدة ١٠ ثوانٍ.", "pic": null, "source": "تدريب"}, {"c": 12, "p": 121, "q": "يجب تخزين المواد الكيميائية بالقرب من الغذاء لسهولة الوصول إليها.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 12, "p": 121, "q": "عند رفع الأشياء الثقيلة، يجب الاعتماد على عضلات الظهر وليس الساقين.", "opts": ["صح", "خطأ"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 12, "p": 121, "q": "يجب غسل اليدين قبل تقديم الإسعافات الأولية لشخص مصاب.", "opts": ["صح", "خطأ"], "key": 0, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 12, "p": 121, "q": "ما أداة الحماية الشخصية المناسبة عند التعامل مع مواد التنظيف والتطهير؟", "opts": ["النظارات الواقية", "القفازات", "الكمامة"], "key": 1, "why": "", "pic": null, "source": "من الكتاب"}, {"c": 12, "p": 121, "q": "ما الإجراء الصحيح عند حدوث جرح أثناء العمل في تحضير الغذاء؟ (حسب شرح الكتاب)", "opts": ["الاستمرار في العمل إذا كان الجرح صغيرًا", "غسل الجرح بالماء والصابون وتغطيته بضمادة مقاومة للماء", "وضع مرهم على الجرح وتركه مكشوفًا ليتنفس"], "key": 1, "why": "تنبيه: اتب جهي", "أستخدم قفازات حرارية وأوجّه البخار بعيدًا عن وجهي"], "key": 2, "why": "استخدم قفازات حرارية مناسبة، وافتح الغطاء بعيدًا عن الوجه لتوجيه البخار بعيدًا عنك.", "pic": null, "source": "تدريب"}, {"c": 12, "p": 112, "q": "إذا سقط سكين من يدك فماذا تفعل؟", "opts": ["أمسكه من أقرب طرف", "أبتعد وأدع السكين يسقط", "أوقف سقوطه بقدمي"], "key": 1, "why": "ابتعد ودعه يسقط. احمل السكاكين وخزّنها بطريقة تحميك وتحمي زملاءك.", "pic": null, "source": "تدريب"}, {"c": 12, "p": 113, "q": "انسكب سائل في الممر، فما الإجراء؟", "opts": ["أغطي السائل بكرتون وأتركه", "أنتظر نهاية الوردية", "أنبّه المارة وأنظف الانسكاب سريعًا"], "key": 2, "why": "احمِ المارة بالتنبيه، ونظف الانسكاب سريعًا، واترك الممر خاليًا من العوائق.", "pic": null, "source": "تدريب"}, {"c": 12, "p": 114, "q": "ماذا تفعل إذا رأيت سلك جهاز تالفًا؟", "opts": ["أوقف استخدام الجهاز وأبلغ المشرف", "أغطي السلك بقطعة قماش", "أواصل استخدامه بيد واحدة"], "key": 0, "why": "توقف عن استخدام الجهاز وأبلغ المشرف لإصلاحه بواسطة المختص.", "pic": null, "source": "تدريب"}, {"c": 12, "p": 115, "q": "كيف ترفع صندوقًا من الأرض؟", "opts": ["أثني ركبتي وأبقي الحمل قريبًا وأرفع بساقي", "أبعد الحمل وأرفع بعضلات ظهري", "أرفع الحمل وألتف بخصري في اللحظة نفسها"], "key": 0, "why": "قيّم وزنه، واثنِ الركبتين، وأبقِ الحمل قريبًا من الجسم وارفع بالساقين. اطلب مساعدة إذا كان ثقيلًا.", "pic": null, "source": "تدريب"}, {"c": 12, "p": 116, "q": "كيف تعرف احتياطات استخدام مادة تنظيف جديدة؟", "opts": ["أعتمد على الرائحة وحدها", "أقرأ الملصق وتعليمات السلامة", "أحدد خطورتها من لون العبوة"], "key": 1, "why": "اقرأ الملصق وتعليمات السلامة، واستخدم معدات الوقاية المناسبة واحفظ المادة في مكانها المخصص.", "pic": null, "source": "تدريب"}, {"c": 12, "p": 117, "q": "أي رمز تحذيري يدل على السمية الحادة؟", "opts": ["رمز أسطوانة الغاز", "الجمجمة والعظمتان المتقاطعتان", "رمز اللهب"], "key": 1, "why": "الجمجمة والعظمتان المتقاطعتان.", "pic": null, "source": "تدريب"}, {"c": 12, "p": 118, "q": "ما الذي ينبغي معرفته قبل وقوع حريق؟", "opts": ["مواعيد توريد الغذاء فقط", "مواقع المخارج والإنذار ومعدات الإطفاء وإجراءات الإخلاء", "عدد الطاولات في قاعة الطعام"], "key": 1, "why": "مواقع المخارج والإنذار ومعدات الإطفاء وإجراءات الإخلاء في المنشأة.", "pic": null, "source": "تدريب"}, {"c": 12, "p": 119, "q": "طابق وسيلة الحماية بالخطر: قفازات حرارية، حذاء مانع للانزلاق، نظارات واقية.", "opts": ["القفازات للانزلاق، والحذاء للرذاذ، والنظارات للحرارة", "القفازات للحرارة، والحذاء للانزلاق، والنظارات للرذاذ", "القفازات للرذاذ، والحذاء للحرارة، والنظارات للانزلاق"], "key": 1, "why": "القفازات للحرارة، والحذاء للأرضيات الزلقة، والنظارات لحماية العين من الرذاذ.", "pic": null, "source": "تدريب"}, {"c": 12, "p": 120, "q": "تُفحص محتويات صندوق الإسعافات ويُعوّض المستهلك منها ويُحفظ في مكان يسهل الوصول إليه.", "opts": ["صح", "خطأ"], "key": 0, "why": "اعرف مكانه وأبقِ الوصول إليه سهلًا، وافحص محتوياته دوريًا وأبلغ عن المستهلك منها لتعويضه.", "pic": null, "source": "تدريب"}, {"c": 12, "p": 120, "q": "بحسب شرح التعامل مع الإصابات، يُترك الجرح مكشوفًا عند تحضير الغذاء.", "opts": ["صح", "خطأ"], "key": 1, "why": "الخيار «ب» في ص ١٢١ هو غسل الجرح وتغطيته بضمادة مقاومة للماء، ويتفق مع شرح الإصابات ص ١٠. يسجل مفتاح ص ١٢٥ الخيار «ج» وهو ترك الجرح مكشوفًا.", "pic": null, "source": "تدريب"}],names=["مقدمة لك", "مقدمة لسلامة الغذاء", "تلوث الغذاء الميكروبي", "تلوث الغذاء الكيميائي والفيزيائي", "فساد الغذاء", "المخاطر الصحية للغذاء غير الآمن", "النظافة الشخصية للعاملين", "النظافة في منشآت الغذاء", "الاشتراطات العامة لمنشآت الغذاء", "إدارة سلامة الغذاء", "التداول الآمن للغذاء", "المهارات العملية في منشآت الغذاء", "الصحة والسلامة المهنية في منشآت الغذاء"],$=id=>document.getElementById(id),num=n=>n.toLocaleString('ar-EG'),storage='study-deck-190-v3',tf=x=>x.opts[0]==='صح';
let state={chapter:'',format:'',ids:bank.map((_,i)=>i),pos:0,answers:{},summary:false,review:false};
try{const s=JSON.parse(localStorage.getItem(storage));if(s&&Array.isArray(s.ids)&&s.ids.length&&s.ids.every(i=>Number.isInteger(i)&&bank[i])&&s.answers&&s.pos>=0&&s.pos<s.ids.length)state=s}catch{}
function save(){try{localStorage.setItem(storage,JSON.stringify(state))}catch{}}
names.forEach((n,i)=>$('chapter').add(new Option(n,i)));$('chapter').value=state.chapter;$('format').value=state.format;
function reset(ids,review=false){state.ids=ids;state.pos=0;state.answers={};state.summary=false;state.review=review;draw()}
function full(){state.chapter=$('chapter').value;state.format=$('format').value;reset(bank.map((_,i)=>i).filter(i=>(!state.chapter||+state.chapter===bank[i].c)&&(!state.format||state.format===(tf(bank[i])?'tf':'mc'))))}
function retry(){reset(state.ids.filter(i=>i in state.answers&&state.answers[i]!==bank[i].key),true)}
function draw(){save();const {ids,pos,answers}=state,i=ids[pos],x=bank[i],done=i in answers,correct=answers[i]===x.key,answered=ids.filter(k=>k in answers).length,hits=ids.filter(k=>answers[k]===bank[k].key).length,miss=answered-hits;
$('progress').textContent=num(answered)+' / '+num(ids.length);$('fill').style.width=answered/ids.length*100+'%';$('accuracy').textContent=num(hits)+' صحيحة · '+num(miss)+' خاطئة';
$('errors').disabled=!miss;$('face').hidden=state.summary;$('summary').hidden=!state.summary;
if(state.summary){$('total').textContent=num(hits)+' / '+num(ids.length);$('summaryText').textContent='إجابات صحيحة · '+num(miss)+' خاطئة · '+num(ids.length-answered)+' لم تُحل';$('errors2').hidden=!miss;$('resume').hidden=answered===ids.length;return}
$('chapterName').textContent=names[x.c];$('kind').textContent=tf(x)?'صح أو خطأ':'اختيار من متعدد';$('meta').textContent=(state.review?'مراجعة الأخطاء · ':'')+'البطاقة '+num(pos+1)+' من '+num(ids.length)+'　·　'+x.source+'　·　ص '+num(x.p);
$('question').textContent=x.q;$('choices').className='choices '+(tf(x)?'binary':x.pic?'pictures':'');$('choices').replaceChildren();
x.opts.forEach((v,j)=>{const b=document.createElement('button');b.className='choice';const k=document.createElement('span');k.className='key';k.textContent=tf(x)?['✓','×'][j]:'أبجد'[j];b.append(k);if(x.pic){const im=new Image();im.src=x.pic[j];im.alt='الخيار '+v;b.append(im)}else b.append(document.createTextNode(v));if(done){b.disabled=true;if(j===x.key)b.classList.add('good');else if(j===answers[i])b.classList.add('bad')}b.onclick=()=>{state.answers[i]=j;draw()};$('choices').append(b)});
const res=$('result');res.hidden=!done;res.className='result'+(correct?'':' wrong');res.replaceChildren();if(done){const b=document.createElement('b');b.textContent=correct?'✓ إجابتك صحيحة':'الإجابة الصحيحة: '+x.opts[x.key];res.append(b);if(x.why){let p=document.createElement('p');p.textContent=x.why;res.append(p)}}
$('prev').disabled=!pos;$('next').textContent=pos===ids.length-1?'نتيجة الجولة':'البطاقة التالية'}
$('filters').onclick=()=>{$('filters').setAttribute('aria-expanded',$('rail').classList.toggle('opened'))};$('chapter').onchange=$('format').onchange=full;
$('next').onclick=()=>{if(state.pos<state.ids.length-1)state.pos++;else state.summary=true;draw()};$('prev').onclick=()=>{state.pos--;draw()};$('errors').onclick=$('errors2').onclick=retry;$('again').onclick=$('again2').onclick=()=>reset([...state.ids],state.review);$('resume').onclick=()=>{state.pos=state.ids.findIndex(i=>!(i in state.answers));state.summary=false;draw()};draw()
</script></body></html>
